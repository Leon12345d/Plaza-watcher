name: Plaza Watcher

on:
  schedule:
    # Runs every 5 minutes (GitHub's practical minimum). Timing can lag
    # slightly during busy periods -- that's a GitHub limitation, not
    # something in this file to fix.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can save plaza_state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python plaza_watcher_github.py

      - name: Save state back to the repo
        run: |
          git config user.name "plaza-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add plaza_state.json plaza_watcher.log
          git diff --staged --quiet || git commit -m "update watcher state"
          git push
